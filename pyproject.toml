[project]
name = "makemcp"
version = "0.1.0"
description = "Minicurso MCP — API de tarefas (FastAPI) + servidor MCP (stdio) + UI Streamlit"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi[standard]>=0.143.3",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[tool.fastapi]
entrypoint = "api.main:app"
